# ==============================================
# Test Profile Configuration
# ==============================================

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

indexer:
  chains:
    ethereum:
      name: Ethereum
      chain-id: 1
      rpc-urls:
        - http://localhost:8545
      start-block: 0
      max-retries-per-block: 1
      retry-delay-ms: 100
      rate-limit-requests-per-second: 100

  concurrency:
    worker-threads: 2
    batch-size: 5
    max-queue-size: 10

  parquet:
    output-path: ./build/test-output
    compression-codec: SNAPPY
    partition-by-chain: false
    partition-by-date: false
    row-group-size: 1048576
    page-size: 65536

  demo:
    enabled: true
    synthetic-block-count: 10

logging:
  level:
    root: WARN
    com.peterstringer: DEBUG
