# ==============================================
# Integration Test Profile Configuration
# Uses Testcontainers PostgreSQL with real Flyway migrations
# ==============================================

spring:
  datasource:
    # URL, username, password injected via @DynamicPropertySource
    hikari:
      maximum-pool-size: 5

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

indexer:
  chains:
    ethereum:
      name: Ethereum
      chain-id: 1
      rpc-urls:
        - http://localhost:8545
      start-block: 0
      end-block: 20
      max-retries-per-block: 1
      retry-delay-ms: 10
      rate-limit-requests-per-second: 100

    polygon:
      name: Polygon
      chain-id: 137
      rpc-urls:
        - http://localhost:8546
      start-block: 0
      end-block: 10
      max-retries-per-block: 1
      retry-delay-ms: 10
      rate-limit-requests-per-second: 100

  concurrency:
    worker-threads: 2
    batch-size: 5
    max-queue-size: 20

  parquet:
    output-path: ${java.io.tmpdir}/indexer-it-output
    compression-codec: SNAPPY
    partition-by-chain: true
    partition-by-date: false
    row-group-size: 1048576
    page-size: 65536

  demo:
    enabled: true
    synthetic-block-count: 25
    seed: 42

logging:
  level:
    root: WARN
    com.peterstringer: INFO
