# ==============================================
# Local Development Profile
# ==============================================
# Run with: --spring.profiles.active=local
# Uses H2 in-memory database and synthetic demo data
# so you can start the app without PostgreSQL.

spring:
  datasource:
    url: jdbc:h2:mem:indexerdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

indexer:
  chains:
    ethereum:
      name: Ethereum
      chain-id: 1
      rpc-urls:
        - http://localhost:8545
      start-block: 0
      max-retries-per-block: 1
      retry-delay-ms: 100
      rate-limit-requests-per-second: 100

  concurrency:
    worker-threads: 4
    batch-size: 10
    max-queue-size: 50

  parquet:
    output-path: ./build/local-output
    compression-codec: SNAPPY
    partition-by-chain: false
    partition-by-date: false

  demo:
    enabled: true
    synthetic-block-count: 100
    seed: 42

logging:
  level:
    root: INFO
    com.peterstringer: DEBUG
    org.web3j: WARN
    org.apache.parquet: WARN
